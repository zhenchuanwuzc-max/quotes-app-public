<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>quotes · 金句库</title>
<link rel="stylesheet" href="/vendor/vditor/dist/index.css">
<style>
:root{
  --paper:#F3F1EC;
  --ink:#121212;
  --red:#E2231A;

  --bg:var(--paper);
  --fg:var(--ink);
  --hair:rgba(18,18,18,.22);
  --rule:rgba(18,18,18,.13);
  --mute:rgba(18,18,18,.5);
  --ink2:rgba(18,18,18,.7);

  --gut:clamp(14px,3.2vw,46px);
  --bar:clamp(48px,6.2vh,62px);
  --hangroom:clamp(6px,1.4vw,20px);
  --btnh:28px;
  --heading-1:2.25em; --heading-2:1.875em; --heading-3:1.625em;
  --heading-4:1.375em; --heading-5:1.25em; --heading-6:1.125em;
  --font:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
html[data-theme="red"]{
  --bg:var(--red); --fg:#fff;
  --hair:rgba(255,255,255,.42);
  --rule:rgba(255,255,255,.3);
  --mute:rgba(255,255,255,.7);
  --ink2:rgba(255,255,255,.84);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow:hidden;
  transition:background-color .3s ease,color .3s ease;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

/* 微排版：中英间隙 / 拉丁·数字收紧 / 标点挤压 / 分词不劈词 */
.gap{display:inline-block;width:.14em}
.lat{letter-spacing:-.02em}
.dg{letter-spacing:-.008em;font-variant-numeric:tabular-nums}
.pc.l{margin-left:-.36em}
.pc.r{margin-right:-.36em}
.w{white-space:nowrap}

/* ---------- shared bar ---------- */
.bar{display:flex;align-items:center;padding:0 var(--gut);gap:clamp(8px,1.4vw,18px);min-width:0;position:relative;z-index:2}
.spacer{flex:1 1 auto;min-width:0}
.wordmark{display:flex;align-items:baseline;flex:none}
.wordmark b{font-size:clamp(13px,1.25vw,16px);font-weight:700;letter-spacing:0}

/* 按钮统一规格：描边一种高度，海报「复制」是唯一实心 */
.tag{
  flex:none;display:inline-flex;align-items:center;justify-content:center;
  height:var(--btnh);padding:0 12px;
  font-size:11px;letter-spacing:0;line-height:1;
  border:1px solid var(--hair);white-space:nowrap;
  transition:background-color .15s ease,color .15s ease,border-color .15s ease;
}
button.tag:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.tag[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.tag[disabled]{opacity:.4;cursor:default}
button.tag[disabled]:hover{background:none;color:inherit;border-color:var(--hair)}

.chip-filter{border-color:var(--hair);color:var(--ink2);gap:.7em}
html[data-theme="red"] .chip-filter{color:var(--fg)}
.chip-filter .x{font-size:13px;line-height:1;opacity:.8}

.hbtn{
  flex:none;width:var(--btnh);height:var(--btnh);border:1px solid var(--hair);
  color:var(--mute);font-size:11px;line-height:1;display:inline-flex;align-items:center;justify-content:center;
  transition:color .15s ease,border-color .15s ease;
}
.hbtn:hover{color:var(--fg);border-color:var(--fg)}

/* ================= INDEX ================= */
#index{position:fixed;inset:0;z-index:3;display:grid;grid-template-columns:clamp(116px,20vw,224px) minmax(0,1fr)}
.isidebar{
  display:flex;flex-direction:column;min-height:0;
  border-right:1px solid var(--hair);background:#ECE9E2;
}
.isidebar .wordmark{flex:none;min-height:var(--bar);align-items:center;padding-inline:clamp(10px,1.6vw,22px)}
.isidebar .wordmark b{font-size:16px}
.imain{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0;--list-gutter:clamp(9px,2.25vw,32px)}
.ihead{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:var(--bar);padding:10px var(--list-gutter);border-bottom:1px solid var(--rule)}
.iactions{display:flex;gap:6px}
#btnNew{background:var(--ink);border-color:var(--ink);color:var(--paper)}
#btnNew:hover:not(:disabled){background:#333;border-color:#333}
.sbox{flex:1 1 320px;min-width:0;border-bottom:1px solid var(--hair);transition:border-color .15s ease}
.sbox:focus-within{border-bottom-color:var(--fg)}
.sbox input{width:100%;min-width:0;height:44px;padding:4px 0;font-size:15px;-webkit-appearance:none;appearance:none}
.sbox input:focus,.sbox input:focus-visible{outline:none}
.sbox input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.sbox input::placeholder{color:var(--mute)}

#iscroll{min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px var(--list-gutter) 18vh}
.rail{min-height:0;overflow:auto;padding:4px clamp(10px,1.6vw,22px) 18px}
.rlab{font-size:10px;letter-spacing:0;color:var(--mute);margin:0 0 8px}
.rsep{height:1px;background:var(--rule);margin:12px 0}
.rbtn{
  position:relative;display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%;
  padding:5px 0 5px 12px;text-align:left;color:var(--ink2);
  font-size:clamp(12px,1.05vw,14px);letter-spacing:0;line-height:1.5;
  transition:color .15s ease;
}
.rbtn .n{flex:none;font-size:10px;letter-spacing:.06em;color:var(--mute);font-variant-numeric:tabular-nums}
.rbtn:hover{color:var(--ink)}
.rbtn[aria-pressed="true"]{color:var(--ink);font-weight:700}
.rbtn[aria-pressed="true"] .n{color:var(--ink)}
.rbtn[aria-pressed="true"]::before{content:"";position:absolute;left:0;top:.38em;bottom:.38em;width:2px;background:var(--ink)}
.rbtn .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rbtn.zero{opacity:.32}

.list{position:relative;border-top:1px solid var(--rule);min-width:0}
.row{
  position:relative;display:grid;
  grid-template-columns:clamp(54px,7%,86px) minmax(0,1fr) clamp(190px,27%,330px);
  align-items:baseline;background:var(--bg);
  padding:clamp(13px,1.7vh,19px) 0;border-bottom:1px solid var(--rule);
  cursor:pointer;transition:background-color .12s ease;
}
.row:hover{background:#EBE9E3}
.row.cur{background:#E8E5DE}
.row.cur::after{content:"";position:absolute;left:0;top:-1px;bottom:-1px;width:2px;background:var(--ink)}
/* 置顶组 / 时间序组之间的分区 */
.row.lastpin{border-bottom:2px solid var(--hair);margin-bottom:clamp(20px,3vh,34px)}

.rn{padding-left:clamp(12px,1.9vw,30px);padding-right:14px;cursor:pointer}
.nw{
  position:relative;display:inline-block;padding:2px 5px;
  font-size:clamp(11px,.92vw,13px);font-weight:500;letter-spacing:.06em;line-height:1.25;
  font-variant-numeric:tabular-nums;
}
.nw .fill{
  position:absolute;left:0;top:0;right:0;bottom:0;
  background:var(--red);transform:scaleX(0);transform-origin:left center;
  transition:transform .25s cubic-bezier(.3,.72,.3,1);
}
.nw.on .fill{transform:scaleX(1);transform-origin:left center}
.nw.off .fill{transform:scaleX(0);transform-origin:right center}
.nw .t{position:relative;z-index:1;color:var(--mute);transition:color .16s ease .07s}
.nw.on .t{color:#fff}
.row:hover .nw:not(.on) .t,.row.cur .nw:not(.on) .t{color:var(--ink)}

.rb{min-width:0;padding-right:clamp(14px,2vw,34px);display:flex;align-items:baseline;gap:.55em}
.rq{
  min-width:0;padding-left:clamp(14px,1.6vw,26px);
  font-size:clamp(14px,1.18vw,17px);line-height:1.62;font-weight:500;
  overflow-wrap:break-word;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;
}
.rq.hang{text-indent:-.42em}
.rq i{font-style:italic}
.rq b{font-weight:700}
.rq code{font-family:inherit;box-shadow:inset 0 -.28em 0 rgba(18,18,18,.13);padding:0 .12em}
/* 搜索结果 ≤3 条：整条展开 */
.rq.full{display:block;-webkit-line-clamp:none;line-clamp:none;overflow:visible}
.rq p{margin:0}
.rq p+p{margin-top:.5em}
.rq p.hang{text-indent:-.42em}
/* 后文：灰字顺排在首句后面。首句一行放得下 → 整行只占一行（.one）；首句自己就折行 → 保持两行 */
/* 行尾省略号取容器的颜色与字重，所以容器本身设成灰/常规，首句再单独提回黑/中粗 —— 省略号才会和后文一样是灰的 */
.rq:not(.full){color:rgba(18,18,18,.4);font-weight:400}
.rq:not(.full) .lead{color:var(--ink);font-weight:500}
.rq.hl:not(.full) .lead{color:inherit}
.rq .rest{margin-left:.5em}
.rq.one{-webkit-line-clamp:1;line-clamp:1}
/* hover 时正文右侧的复制提示 */
/* 命中：加粗；非命中降中灰（红只留给置顶） */
mark{background:none;color:var(--ink);font-weight:700}
.hl{color:rgba(18,18,18,.46)}

/* 右侧：出处 · 用途 一行 + 仅聚焦/hover 显示的操作 */
.rmeta{position:relative;display:flex;align-items:baseline;gap:clamp(10px,1.4vw,22px);padding-right:clamp(6px,1vw,16px);min-width:0}
.mtxt{
  flex:0 1 auto;min-width:0;display:flex;align-items:baseline;white-space:nowrap;overflow:hidden;
  font-size:11px;line-height:1.5;letter-spacing:0;color:var(--mute);
}
/* 窄窗口下只截长出处，用途始终完整显示 */
.mtxt > span:not(.uc){flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mtxt.hang{text-indent:-.42em}
.mtxt .uc{flex:none;text-indent:0;color:rgba(18,18,18,.32)}
/* 非聚焦行的操作不占位，把宽度让给出处；聚焦/hover 时才出现 */
.acts{flex:none;margin-left:auto;display:none;gap:.95em;white-space:nowrap}
.row:hover .acts,.row.cur .acts,.row:focus-within .acts{display:flex}
.acts button{
  font-size:11px;letter-spacing:0;color:rgba(18,18,18,.55);cursor:pointer;
  border-bottom:1px solid transparent;padding-bottom:1px;transition:color .15s ease;
}
.acts button:hover{color:var(--ink);border-bottom-color:var(--ink)}
/* 原位反馈：元数据位置短暂换成「已复制」 */
.cflash{
  position:absolute;left:0;top:0;display:none;
  font-size:11px;line-height:1.5;letter-spacing:0;color:var(--ink);white-space:nowrap;
}
.row.copied .cflash{display:block}
.row.copied .mtxt,.row.copied .acts{visibility:hidden}
.inone{padding:clamp(34px,8vh,80px) 0 0 clamp(12px,1.9vw,30px);font-size:clamp(28px,7vw,72px);font-weight:700;letter-spacing:-.04em}

/* 附件有固定占位，图片到达不改变目录行高度。 */
.row-media{flex:none;position:relative;width:72px;height:48px;margin-left:auto;background:var(--rule);overflow:hidden}
.row-media img{display:block;width:100%;height:100%;object-fit:cover}
.row-media span{position:absolute;right:2px;bottom:2px;background:var(--paper);color:var(--ink);font-size:10px;padding:0 4px}
.rq{flex:1 1 auto}
#posterImages{flex:0 0 38%;min-height:100px;max-height:45%;display:flex;gap:12px;overflow-x:auto;margin-top:20px;padding-bottom:3px}
#posterImages button{flex:0 0 min(100%,400px);min-width:0;height:100%;background:var(--rule);border:1px solid var(--hair)}
#posterImages img{display:block;width:100%;height:100%;object-fit:contain}
.field.image-only #posterImages{flex:1 1 auto;max-height:100%;margin-top:0}
#sourceLink{margin-top:10px;text-underline-offset:3px;color:var(--fg)}
#imageViewer{position:fixed;inset:0;z-index:30;background:rgba(10,10,10,.94);color:white;display:flex;flex-direction:column;padding:18px;gap:14px}
.image-viewer-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex:none;font-size:13px}
#imageViewer img{flex:1 1 auto;min-height:0;width:100%;object-fit:contain}
#imageViewerMessage{font-size:13px;color:#ddd}
#imageClose{border:1px solid #aaa;padding:7px 18px;font-size:13px}

/* ================= POSTER ================= */
#app{position:relative;z-index:2;height:100dvh;display:grid;grid-template-rows:var(--bar) 1fr var(--bar)}
#stage{
  position:relative;min-height:0;display:grid;
  grid-template-columns:clamp(96px,11vw,168px) 1fr;
  gap:clamp(10px,2vw,32px);
  padding:clamp(14px,2.6vh,32px) var(--gut) clamp(10px,2vh,26px);
}
.marker{display:flex;flex-direction:column;min-height:0;min-width:0;align-items:flex-start;overflow:hidden}
.marker .m{
  display:block;max-width:100%;text-align:left;
  font-size:11px;line-height:1.5;letter-spacing:0;color:var(--mute);
  overflow-wrap:anywhere;
}
.marker .m+.m{margin-top:.4em}
.marker .no{font-variant-numeric:tabular-nums;letter-spacing:.06em}
.marker .dt{font-variant-numeric:tabular-nums;letter-spacing:.04em}
.marker button.m{cursor:pointer;transition:color .15s ease}
.marker button.m:hover{color:var(--fg)}

.field{display:flex;flex-direction:column;min-width:0;min-height:0}
.quote{
  flex:1 1 auto;min-height:0;overflow:hidden;position:relative;
  display:flex;flex-direction:column;justify-content:flex-start;
  margin-left:calc(-1 * var(--hangroom));
  padding-left:var(--hangroom);
  padding-right:2px;
}
.quote.ovf{overflow-y:auto;scrollbar-width:thin}
#qt{
  width:100%;max-width:48em;font-size:clamp(18px,1.6vw,20px);line-height:1.75;
  font-weight:400;letter-spacing:0;overflow-wrap:anywhere;
  animation:rise .34s cubic-bezier(.2,.7,.2,1) both;
}
#qt p{margin:0 0 .85em}
#qt strong,#qt b{font-weight:700}
#qt em,#qt i{font-style:italic}
#qt code{font-family:ui-monospace,monospace;font-size:.9em;background:var(--rule);padding:.08em .25em}
#qt pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--rule);padding:.8em 1em}
#qt pre code{background:none;padding:0}
#qt blockquote{margin:.8em 0;padding-left:1em;border-left:2px solid var(--hair);color:var(--ink2)}
#qt ul,#qt ol{margin:.7em 0;padding-left:1.5em}
#qt li+li{margin-top:.3em}
#qt a{color:inherit;text-decoration:underline}
#qt hr{border:0;border-top:1px solid var(--hair);margin:1.3em 0}
#qt table{display:block;max-width:100%;overflow:auto;border-collapse:collapse}
#qt th,#qt td{border:1px solid var(--hair);padding:.3em .6em}
#qt :is(h1,h2,h3,h4,h5,h6){margin:1em 0 .45em;line-height:1.35;font-weight:700}
#qt>:first-child{margin-top:0}
#qt h1,#cbox .vditor-reset h1,#cbox .vditor-hint button[data-tag="h1"]{font-size:var(--heading-1)!important}
#qt h2,#cbox .vditor-reset h2,#cbox .vditor-hint button[data-tag="h2"]{font-size:var(--heading-2)!important}
#qt h3,#cbox .vditor-reset h3,#cbox .vditor-hint button[data-tag="h3"]{font-size:var(--heading-3)!important}
#qt h4,#cbox .vditor-reset h4,#cbox .vditor-hint button[data-tag="h4"]{font-size:var(--heading-4)!important}
#qt h5,#cbox .vditor-reset h5,#cbox .vditor-hint button[data-tag="h5"]{font-size:var(--heading-5)!important}
#qt h6,#cbox .vditor-reset h6,#cbox .vditor-hint button[data-tag="h6"]{font-size:var(--heading-6)!important}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.empty-poster{display:flex;flex-direction:column;justify-content:flex-start;height:100%}
.empty-poster .big{font-size:clamp(46px,11vw,150px);font-weight:700;letter-spacing:-.04em;line-height:.9}
.empty-poster .slash{display:block;width:clamp(80px,22vw,320px);height:6px;background:var(--fg);margin-top:.5em}

.pin-toggle{
  flex:none;display:inline-flex;align-items:center;justify-content:center;
  height:var(--btnh);padding:0 12px;border:1px solid var(--hair);
  font-size:11px;letter-spacing:0;line-height:1;color:var(--mute);
  transition:color .15s ease,border-color .15s ease;
}
.pin-toggle:hover{color:var(--fg);border-color:var(--fg)}
.pin-toggle[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
.btn-copy{
  flex:none;display:inline-flex;align-items:center;justify-content:center;
  height:var(--btnh);padding:0 18px;border:1px solid var(--fg);
  background:var(--fg);color:var(--bg);
  font-size:11px;letter-spacing:0;line-height:1;transition:opacity .15s ease;
}
.btn-copy:hover{opacity:.84}
.btn-copy[disabled]{opacity:.35;cursor:default}
.nav{display:flex;gap:2px;flex:none}
.nav button{
  width:clamp(28px,2.8vw,34px);height:clamp(24px,2.8vh,30px);
  display:grid;place-items:center;font-size:15px;line-height:1;
  color:var(--mute);transition:color .15s ease;
}
.nav button:hover{color:var(--fg)}
.nav button[disabled]{opacity:.25;cursor:default}
.nav button[disabled]:hover{color:var(--mute)}

/* ================= COMPOSE ================= */
#compose{
  position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;
  background:var(--paper);color:var(--ink);
  --bg:var(--paper);--fg:var(--ink);
  --hair:rgba(18,18,18,.22);--mute:rgba(18,18,18,.5);
}
#compose .chead{height:var(--bar);flex:none;display:flex;align-items:center;gap:14px;padding:0 var(--gut);border-bottom:1px solid var(--ink)}
#compose .cbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;width:100%;max-width:1040px;margin-inline:auto;padding:clamp(14px,2.4vh,28px) var(--gut) clamp(12px,2vh,22px)}
#cbox{flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column}
#cedit{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}

/* Vditor 压进本设计的语言：零圆角 / 发丝线 / 系统无衬线 / 无彩色强调 */
#cbox .vditor{
  --border-color:rgba(18,18,18,.22);
  --second-color:rgba(18,18,18,.36);
  --panel-background-color:#F3F1EC;
  --panel-shadow:none;
  --toolbar-background-color:transparent;
  --toolbar-icon-color:rgba(18,18,18,.42);
  --toolbar-icon-hover-color:#121212;
  --toolbar-height:32px;
  --textarea-background-color:transparent;
  --textarea-text-color:#121212;
  --count-background-color:transparent;
  --heading-border-color:rgba(18,18,18,.13);
  --blockquote-color:rgba(18,18,18,.5);
  --ir-heading-color:#121212;
  --ir-title-color:rgba(18,18,18,.38);
  --ir-bi-color:#121212;
  --ir-link-color:#121212;
  --ir-bracket-color:rgba(18,18,18,.38);
  --ir-paren-color:rgba(18,18,18,.38);
  height:100%!important;border-radius:0!important;
  font-family:var(--font)!important;background:transparent;
}
#cbox .vditor-toolbar{border-bottom:1px solid var(--rule)!important;border-radius:0!important;padding:0 2px!important}
#cbox .vditor-toolbar__item button{border-radius:0!important}
#cbox button[data-type="headings"]{width:auto;min-width:88px;padding:0 8px;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap}
#cbox button[data-type="headings"]:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#cbox button[data-type="headings"]+.vditor-hint{
  font-size:12px;min-width:260px;max-width:min(300px,calc(100vw - 2 * var(--gut)));
  max-height:min(70vh,360px);overflow-y:auto;
}
#cbox .vditor-hint button[data-tag]{line-height:1.35;font-weight:700;padding:6px 10px}
#cbox .vditor-hint button[data-tag="p"]{font-size:1em;font-weight:400}
#cbox .vditor-hint button[aria-checked="true"]{background:var(--rule);color:var(--ink)}
#cbox .vditor-toolbar__divider{border-left:1px solid var(--rule)}
#cbox .vditor-content{flex:1 1 auto;min-height:0;border-radius:0!important}
#cbox .vditor-reset{--editor-leading:1.72;font-family:var(--font)!important;font-size:16px!important;line-height:var(--editor-leading)!important;color:var(--ink)!important;word-break:break-word}
#cbox .vditor-ir pre.vditor-reset{padding:14px clamp(14px,2vw,24px)!important;background:transparent!important}
/* WebKit 把空列表项的光标画在线盒顶部；用等量内边距保留原来的行高。 */

    if(rest && TAIL.indexOf(rest.charAt(rest.length-1))<0 && '，、：,:'.indexOf(rest.charAt(rest.length-1))<0) rest+=' ';
    rest+=parts[i];
  }
  return { s:s, rest:rest };
}

function ymd(iso){ return iso.length>=10 ? iso.slice(2,4)+'.'+iso.slice(5,7)+'.'+iso.slice(8,10) : ''; }

/* ---------- 分词：中文按语义断行，不劈词 ---------- */
var SEG=(function(){
  try{ return new Intl.Segmenter('zh',{granularity:'word'}); }catch(e){ return null; }
})();
function chunks(t){
  if(!SEG) return null;
  var raw;
  try{ raw=Array.from(SEG.segment(t), function(s){ return s.segment; }); }
  catch(e){ return null; }
  var out=[],i,g,last;
  for(i=0;i<raw.length;i++){
    g=raw[i];
    last=out.length? out[out.length-1] : null;
    if(/^\s+$/.test(g)){ out.push(g); continue; }
    if(last!==null && CLOSEP.indexOf(g.charAt(0))>=0 && !/^\s+$/.test(last)){ out[out.length-1]=last+g; continue; }
    if(last!==null && OPENP.indexOf(last.charAt(last.length-1))>=0){ out[out.length-1]=last+g; continue; }
    if(last!==null && g.length===1 && CJK.test(g) && CJK.test(last.charAt(last.length-1)) && last.length<4){
      out[out.length-1]=last+g; continue;
    }
    out.push(g);
  }
  return out;
}

/* ---------- 标点挤压：只在连续标点 / 行首 / 行尾 ---------- */
function markSqueeze(S){
  var f=[], i, a=0, b=S.length-1;
  for(i=0;i<S.length;i++) f[i]=0;
  while(a<=b && /\s/.test(S.charAt(a))) a++;
  while(b>=a && /\s/.test(S.charAt(b))) b--;
  if(a>b) return f;
  /* 行首：开括号已由 .hang 悬挂处理，不重复挤 */
  if(isSq(S.charAt(a)) && OPENP.indexOf(S.charAt(a))<0) f[a]|=1;
  if(isSq(S.charAt(b))) f[b]|=2;
  for(i=a+1;i<=b;i++){
    if(isSq(S.charAt(i)) && isSq(S.charAt(i-1))) f[i]|=1;
  }
  return f;
}
function emitRun(host,p,opt,flags,gi,prevC){
  var buf='', mode='', i, c, prev, f, m, sp, g;
  function flush(){
    if(!buf) return;
    if(mode){ var s=document.createElement('span'); s.className=mode; s.textContent=buf; host.appendChild(s); }
    else host.appendChild(document.createTextNode(buf));
    buf='';
  }
  for(i=0;i<p.length;i++){
    c=p.charAt(i);
    prev = i? p.charAt(i-1) : prevC;
    if(opt.gap && prev && ((CJK.test(prev)&&LAT.test(c))||(LAT.test(prev)&&CJK.test(c)))){
      flush(); mode='';
      g=document.createElement('span'); g.className='gap'; host.appendChild(g);
    }
    f = flags? (flags[gi+i]||0) : 0;
    if(f){
      flush(); mode='';
      sp=document.createElement('span');
      sp.className='pc'+((f&1)?' l':'')+((f&2)?' r':'');
      sp.textContent=c; host.appendChild(sp);
      continue;
    }
    m = LETTER.test(c) ? 'lat' : (DIGIT.test(c) ? 'dg' : '');
    if(m!==mode){ flush(); mode=m; }
    buf+=c;
  }
  flush();
  return p.length? p.charAt(p.length-1) : prevC;
}
function buildFrag(t,opt,flags,base,prevC){
  var frag=document.createDocumentFragment();
  var parts=(opt.seg? chunks(t):null) || [t];
  var gi=base;
  parts.forEach(function(p){
    if(!p) return;
    var host;
    if(opt.seg && p.trim().length && p.length<=14){
      host=document.createElement('span'); host.className='w';
      frag.appendChild(host);
    } else host=frag;
    prevC=emitRun(host,p,opt,flags,gi,prevC);
    gi+=p.length;
  });
  return frag;
}
/* 按「视觉行」（<br> 分段）切开处理，行首/行尾标记才有意义 */
function typesetLines(container,opt){
  var w=document.createTreeWalker(container,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,null,false);
  var seq=[], n;
  while((n=w.nextNode())){
    if(n.nodeType===3){ if(n.nodeValue) seq.push(n); }
    else if(n.nodeName==='BR') seq.push(n);
  }
  var lines=[], curL=[];
  seq.forEach(function(nd){
    if(nd.nodeType===1){ lines.push(curL); curL=[]; }
    else curL.push(nd);
  });
  lines.push(curL);
  lines.forEach(function(tns){
    if(!tns.length) return;
    var S='', k;
    for(k=0;k<tns.length;k++) S+=tns[k].nodeValue;
    var flags = opt.squeeze? markSqueeze(S) : null;
    var off=0;
    tns.forEach(function(tn){
      var t=tn.nodeValue, base=off;
      off+=t.length;
      var frag=buildFrag(t,opt,flags,base, base>0? S.charAt(base-1) : '');
      if(tn.parentNode) tn.parentNode.replaceChild(frag,tn);
    });
  });
}
function typeset(node,opt){
  if(opt.squeeze){
    var ps=node.querySelectorAll? node.querySelectorAll('p') : null;
    if(ps && ps.length){ for(var i=0;i<ps.length;i++) typesetLines(ps[i],opt); return; }
  }
  typesetLines(node,opt);
}
/* highlight matches inside an already-rendered node */
function hilite(rootNode, q){
  if(!q||!rootNode) return 0;
  var rx = new RegExp(rxEsc(q),'gi');
  var w = document.createTreeWalker(rootNode, NodeFilter.SHOW_TEXT, null, false);
  var nodes=[], n, hits=0;
  while((n=w.nextNode())) nodes.push(n);
  nodes.forEach(function(node){
    var t=node.nodeValue; rx.lastIndex=0;
    if(!rx.test(t)) return;
    rx.lastIndex=0;
    var frag=document.createDocumentFragment(), last=0, m;
    while((m=rx.exec(t))){
      if(!m[0].length){ rx.lastIndex++; continue; }
      if(m.index>last) frag.appendChild(document.createTextNode(t.slice(last,m.index)));
      var el=document.createElement('mark'); el.textContent=m[0];
      frag.appendChild(el); hits++;
      last=m.index+m[0].length;
    }
    if(last<t.length) frag.appendChild(document.createTextNode(t.slice(last)));
    node.parentNode.replaceChild(frag,node);
  });
  return hits;
}

/* ================= list model ================= */
function cmp(a,b){
  if(a.pinned!==b.pinned) return a.pinned?-1:1;
  if(a.created_at!==b.created_at) return a.created_at<b.created_at?1:-1;
  return a.id<b.id?1:-1;
}
function qmatch(q){
  var s=state.q.trim().toLowerCase();
  if(!s) return true;
  return (q.plain+' '+q.source+' '+q.use_case).toLowerCase().indexOf(s)>=0;
}
function pass(q){
  var f=state.filter;
  if(f==='__pin__'){ if(!q.pinned) return false; }
  else if(f!==null && (q.use_case||'')!==f) return false;
  return qmatch(q);
}
function rebuild(){
  state.L = DB.filter(pass).sort(cmp);
  var i=-1,k;
  if(state.id) for(k=0;k<state.L.length;k++){ if(state.L[k].id===state.id){ i=k; break; } }
  if(i<0) i=Math.max(0,Math.min(state.idx, state.L.length-1));
  state.idx = state.L.length? i : 0;
  state.id  = state.L.length? state.L[state.idx].id : null;
  state.cur = Math.max(0,Math.min(state.cur, state.L.length-1));
}
function at(i){ return state.L[i]||null; }
function cur(){ return at(state.view==='poster'? state.idx : state.cur); }
function useCases(){
  var seen={}, out=[];
  DB.forEach(function(q){ var k=q.use_case||''; if(!(k in seen)){ seen[k]=0; out.push(k); } seen[k]++; });
  out.sort(function(a,b){
    if(a==='') return 1; if(b==='') return -1;
    if(seen[b]!==seen[a]) return seen[b]-seen[a];
    return a.localeCompare(b,'zh');
  });
  return { order:out, count:seen };
}

function fitLeads(){
  var rqs=listEl.querySelectorAll('.rq:not(.full)'), i, wraps=[];
  for(i=0;i<rqs.length;i++) rqs[i].classList.remove('one');

var POSTER_TAGS='P H1 H2 H3 H4 H5 H6 STRONG EM B I S DEL CODE PRE BLOCKQUOTE UL OL LI BR HR A TABLE THEAD TBODY TR TH TD'.split(' ');
var POSTER_DROP='SCRIPT STYLE IFRAME OBJECT EMBED SVG MATH VIDEO AUDIO SOURCE LINK META FORM'.split(' ');
function markdownFragment(text){
  var source=document.createElement('template');
  source.innerHTML=posterMarkdown.Md2HTML(String(text||''));
  var fragment=document.createDocumentFragment();
  function copy(from,to){
    [].forEach.call(from.childNodes,function(node){
      if(node.nodeType===3){ to.appendChild(document.createTextNode(node.nodeValue)); return; }
      if(node.nodeType!==1 || POSTER_DROP.indexOf(node.tagName)>=0) return;
      if(node.tagName==='IMG'){
        if(node.getAttribute('alt')) to.appendChild(document.createTextNode(node.getAttribute('alt')));
        return;
      }
      if(node.tagName==='INPUT'){
        if((node.getAttribute('type')||'').toLowerCase()==='checkbox'){
          var checkbox=document.createElement('input'); checkbox.type='checkbox';
          checkbox.checked=node.hasAttribute('checked'); checkbox.disabled=true;
          to.appendChild(checkbox);
        }
        return;
      }
      if(POSTER_TAGS.indexOf(node.tagName)<0){ copy(node,to); return; }
      var el=document.createElement(node.tagName.toLowerCase());
      if(node.tagName==='A'){
        var href=safeSourceUrl(node.getAttribute('href'));
        if(href){ el.href=href; el.target='_blank'; el.rel='noopener noreferrer'; }
      }
      if(node.tagName==='OL' && /^\d+$/.test(node.getAttribute('start')||'')) el.start=Number(node.getAttribute('start'));
      copy(node,el); to.appendChild(el);
    });
  }
  copy(source.content,fragment);
  return fragment;
}

function wrapText(x,text,maxw){
  var lines=[];
  String(text).replace(/\r\n?/g,'\n').split('\n').forEach(function(paragraph){
    var tokens=paragraph.match(/[A-Za-z0-9][A-Za-z0-9'’\-]*[ \t]*|[ \t]+|./gu)||[], cur='';
    tokens.forEach(function(token){
      if(cur && x.measureText((cur+token).replace(/[ \t]+$/,'')).width>maxw){
        lines.push(cur.replace(/[ \t]+$/,'')); cur=''; token=token.replace(/^[ \t]+/,'');
      }
      if(x.measureText(token.replace(/[ \t]+$/,'')).width<=maxw){ cur+=token; return; }
      Array.from(token).forEach(function(character){
        if(cur && x.measureText(cur+character).width>maxw){ lines.push(cur); cur=''; }
        cur+=character;
      });
    });
    lines.push(cur.replace(/[ \t]+$/,''));
  });

}
function wallpaperBlocks(){
  var baseFont=parseFloat(getComputedStyle(qt).fontSize), blocks=[];
  function inlineText(node){
    if(node.nodeType===3) return node.nodeValue.replace(/[\t\r\n ]+/g,' ');
    if(node.nodeType!==1) return '';
    if(node.tagName==='BR') return '\n';
    if(node.tagName==='INPUT' && node.type==='checkbox') return node.checked?'[x] ':'[ ] ';
    return [].map.call(node.childNodes,inlineText).join('');
  }
  function add(text,element,indent){
    if(!text.trim()) return;
    var style=getComputedStyle(element), size=parseFloat(style.fontSize);
    blocks.push({text:text.trim(),ratio:size/baseFont,weight:style.fontWeight,
      lineHeight:parseFloat(style.lineHeight)/size,indent:indent});
  }
  function walk(container,indent,prefix){
    var buffer='', marker=prefix||'';
    function flush(){
      if(buffer.trim()){ add(marker+buffer.trim(),container,indent); marker=''; }
      buffer='';
    }
    [].forEach.call(container.childNodes,function(node){
      if(node.nodeType!==1){ buffer+=inlineText(node); return; }
      var tag=node.tagName;
      if(tag==='UL' || tag==='OL'){
        flush();
        var nested=container.closest('li')?1:0;
        [].forEach.call(node.children,function(item,index){
          if(item.tagName!=='LI') return;
          var task=item.querySelector(':scope > input[type="checkbox"],:scope > p > input[type="checkbox"]');

          walk(item,indent+nested,bullet);

      }else if(tag==='PRE'){
        flush(); add(marker+node.textContent,node,indent); marker='';
      }else if(tag==='TR'){
        flush(); add(marker+[].map.call(node.cells,function(cell){ return inlineText(cell).trim(); }).join(' | '),node,indent); marker='';
      }else if(/^(P|H[1-6]|DIV|BLOCKQUOTE|TABLE|THEAD|TBODY)$/.test(tag)){
        flush();
        var before=blocks.length;
        walk(node,indent,marker);
        if(blocks.length>before) marker='';

function renderWallpaper(q){

      var size=base*block.ratio;

function shortcutMatches(e,binding){
  if(e.altKey) return false;
  if(binding.indexOf('mod+')===0){
    if(!(e.metaKey||e.ctrlKey) || e.shiftKey!==(binding.indexOf('shift+')>=0)) return false;
    return e.key.toLowerCase()===binding.split('+').pop();
  }
  if(e.metaKey||e.ctrlKey) return false;
  if(binding==='Space') return e.key===' ' && !e.shiftKey;
  if(binding.length>1) return e.key===binding && !e.shiftKey;
  var key=e.key==='/' && e.shiftKey?'?':e.key.toLowerCase();
  return key===binding;
}
function matchingShortcut(e,scope){
  if(!shortcutSettings) return null;
  for(var i=0;i<shortcutSettings.actions.length;i++){
    var action=shortcutSettings.actions[i];
    if(action.scope.indexOf(scope)>=0 && shortcutMatches(e,shortcutSettings.bindings[action.id])) return action.id;
    for(var j=0;j<action.aliases.length;j++){
      var alias=action.aliases[j];
      if(alias.scope.indexOf(scope)>=0 && shortcutMatches(e,alias.binding)) return action.id;
    }
  }
  return null;
}

function dispatchShortcut(e,scope){

}

        var keep = state.view==='index'? iscroll.scrollTop : null;
        var cid=(cur()||{}).id||state.id;
        return reload({id:cid}).then(function(){ repaint(keep,cid); });
      }
    })
    .catch(function(e){ status('同步出错：'+String(e.message||e).slice(0,60)); })
    .then(function(){ b.disabled=false; b.textContent='同步'; });
}

/* ---- 更新（checkUpdate 必须是全局函数：macOS 菜单栏 evaluate_js 调 checkUpdate(true)） ---- */
function cmpVer(a,b){
  var pa=String(a).split('.').map(Number), pb=String(b).split('.').map(Number), i, d;
  for(i=0;i<Math.max(pa.length,pb.length);i++){
    d=(pa[i]||0)-(pb[i]||0);
    if(d) return d>0?1:-1;
  }
  return 0;
}
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function checkUpdate(verbose){
  if(verbose) status('检查更新中……',0,true);
  return api('/check-update').then(function(d){
    if(d.error){
      if(verbose) status('检查失败：'+String(d.error).slice(0,100)+'，请稍后重试',6000,false);
      return;
    }
    var me=d.current, latest=d.latest;
    if(!latest){ if(verbose) status('暂未找到已发布的版本',3000,false); return; }
    if(cmpVer(latest,me)>0){
      if(verbose) lsDel('dismissedVer');
      if(lsGet('dismissedVer')!==latest){
        $('ubarVer').textContent='v'+latest;
        ubar.setAttribute('data-url', d.html_url||'');
        ubar.setAttribute('data-ver', latest);
        ubar.classList.add('show');
      }
      if(verbose) status('发现新版本 v'+latest,3000,false);
    }else if(verbose) status('已是最新 v'+me,2600,false);
  }).catch(function(){ if(verbose) status('检查失败：本地服务无响应，请重新打开 App',4000,false); });
}
window.checkUpdate=checkUpdate;
var upTicks=0;
function pollUpdateProgress(){
  if(upTicks++>900){ status('更新状态未回报，已停止轮询',4000,false); return; }
  api('/update-progress').then(function(p){
    if(p.status==='error'){ status('更新失败：'+String(p.error||'').slice(0,80),6000,false); return; }
    if(p.status==='downloading'){
      var pct=p.total>0? Math.floor(p.downloaded/p.total*100) : 0;
      status('下载中 '+pct+'%',0,true); statusPct(pct);
    }else if(p.status==='downloaded'||p.status==='installing'){
      status('安装中……',0,true); statusPct(100);
    }else if(p.status==='restarting'){
      status('App 即将重启……',6000,false); statusPct(100); return;
    }
    setTimeout(pollUpdateProgress,400);
  }).catch(function(){ status('App 即将重启……',6000,false); });
}
$('ubarNow').addEventListener('click', function(){
  if(!confirm('立即下载新版本并替换 App 吗？\n替换过程 App 会自动重启。')) return;
  status('准备下载……',0,true); statusPct(0);
  api('/install-update',{method:'POST'}).then(function(d){
    if(d.error || !d.ok){ status('触发失败：'+String(d.error||'未知').slice(0,80),6000,false); return; }
    upTicks=0; pollUpdateProgress();
  }).catch(function(){ status('网络错误',4000,false); });
});
$('ubarView').addEventListener('click', function(){
  var u=ubar.getAttribute('data-url');
  if(u) window.open(u,'_blank');
});
$('ubarNo').addEventListener('click', function(){
  var v=ubar.getAttribute('data-ver');
  if(v) lsSet('dismissedVer',v);
  ubar.classList.remove('show');
});

/* ---- 自动刷新：每 7 秒比对 /health 的 total ---- */
var pollBusy=false;
function typingSomewhere(){
  var a=document.activeElement;
  if(!a) return false;
  if(a===qInput||a===cSrc||a===cUse) return true;
  return !!(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'||a.isContentEditable);
}
function pollHealth(){
  if(pollBusy || state.load!=='ready') return;
  if(!composeEl.hidden || !helpEl.hidden) return; /* 编辑或设置面板开着不打断 */
  if(typingSomewhere()) return;
  pollBusy=true;
  api('/health').then(function(d){
    if(typeof d.total!=='number' || d.total===DB.length) return;
    var keep = state.view==='index'? iscroll.scrollTop : null;
    var cid = (cur()||{}).id || state.id;
    return reload({id:cid}).then(function(){ repaint(keep,cid); });
  }).catch(function(){}).then(function(){ pollBusy=false; });
}

/* ---- keyboard ---- */
function typing(e){
  var t=e.target;
  return !!(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable || (t.closest && t.closest('[contenteditable]:not([contenteditable="false"])'))));
}
document.addEventListener('keydown', function(e){
  if(e.defaultPrevented || e.isComposing || e.keyCode===229 || !imageViewer.hidden || !helpEl.hidden) return;
  if((e.key==='Enter'||e.key===' ') && e.target.closest && e.target.closest('button,a,summary,[role="button"],[role="link"]')) return;
  if(e.key==='Escape'){
    if(!composeEl.hidden){ closeCompose(); return; }
    if(state.view==='poster'){ showIndex(); return; }
    if(state.q){ qInput.value=''; state.q=''; state.id=null; state.idx=0; state.cur=0; rebuild(); renderList(); return; }
    if(state.filter!==null){ setFilter(null); return; }
    return;
  }
  if(typing(e) || !composeEl.hidden) return;
  if(dispatchShortcut(e,state.view)) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='Home' || e.key==='End'){
    e.preventDefault();
    var index=e.key==='Home'?0:state.L.length-1;
    if(state.view==='index') setCur(index,true); else showPoster(index,true);
  }else if(e.key==='Enter' && state.view==='index' && !e.repeat){
    e.preventDefault(); if(state.L.length) showPoster(state.cur,true);
  }
});

/* ---- wheel / swipe (poster) ---- */
/* 一次手势只翻一条：
   - 旧实现用 420ms 时间锁，触控板一次滑动的惯性尾巴能拖 1 秒多 → 会连翻（多）；
     且单个事件 delta<8 直接丢弃、不累计 → 轻滑不触发（漏）。
   - 现在按「手势」判定：事件间隔 >180ms、方向反转、或惯性衰减后重新加速 = 新手势；
     每个手势内累计位移，过阈值翻一条，之后本手势剩余的惯性事件全部吞掉。 */
var wAcc=0, wFired=false, wLast=0, wPeak=0, wMin=0, wScrolled=false;
stage.addEventListener('wheel', function(e){
  if(state.view!=='poster') return;
  var d=Math.abs(e.deltaY)>Math.abs(e.deltaX)? e.deltaY : e.deltaX;
  if(e.deltaMode===1) d*=32;                       /* 按「行」上报的鼠标滚轮 → 像素 */
  if(!d) return;
  var now=performance.now(), a=Math.abs(d);
  var reaccel = wMin<=wPeak*0.4 && a>=wMin*3 && a>=15;   /* 已明显衰减后又猛增 = 新的一划 */
  var fresh = (now-wLast>180) || (wAcc!==0 && (d>0)!==(wAcc>0)) || ((wFired||wScrolled) && reaccel);
  if(fresh){ wAcc=0; wFired=false; wScrolled=false; wPeak=0; wMin=0; }
  wLast=now;
  if(a>=wPeak){ wPeak=a; wMin=a; } else if(a<wMin){ wMin=a; }

  /* 长文海报本身可滚动：先让它原生滚；滚到头之后，要「另起一划」才翻页 */
  if(qtBox.classList.contains('ovf')){
    var atTop=qtBox.scrollTop<=0, atEnd=qtBox.scrollTop+qtBox.clientHeight>=qtBox.scrollHeight-1;
    if((d>0&&!atEnd)||(d<0&&!atTop)){ wScrolled=true; return; }
    if(wScrolled){ e.preventDefault(); return; }
  }
  e.preventDefault();
  if(wFired) return;
  wAcc+=d;
  if(Math.abs(wAcc)>=50){ wFired=true; step(wAcc>0?1:-1); }
},{passive:false});

var tx=0,ty=0,tActive=false;
stage.addEventListener('touchstart',function(e){
  if(e.touches.length!==1) return;
  tActive=true; tx=e.touches[0].clientX; ty=e.touches[0].clientY;
},{passive:true});
stage.addEventListener('touchend',function(e){
  if(!tActive) return; tActive=false;
  var t=e.changedTouches[0], dx=t.clientX-tx, dy=t.clientY-ty;
  if(Math.max(Math.abs(dx),Math.abs(dy))<46) return;
  if(Math.abs(dx)>Math.abs(dy)) step(dx<0?1:-1);
  else step(dy<0?1:-1);
},{passive:true});

/* ---- resize ---- */
var rt;
window.addEventListener('resize', function(){
  clearTimeout(rt);
  rt=setTimeout(function(){
    if(state.view==='poster') fitQuote();
    else fitLeads();
  },90);
});
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(function(){ if(state.view==='poster') fitQuote(); });
}

/* ---- boot ---- */
rebuild();
indexEl.hidden=false; app.hidden=true;
renderRail(); renderList();                    /* 先画「载入中」，不动 hash */
loadShortcutSettings();
reload().then(function(){
  applyHash();
}).catch(function(e){
  state.load='error';
  renderRail(); renderList();
  status('载入失败：'+String(e.message||e).slice(0,60),5000);
});
setInterval(pollHealth,7000);
setTimeout(function(){ checkUpdate(false); },2000);
setInterval(function(){ checkUpdate(false); },60*60*1000);
})();
</script>
