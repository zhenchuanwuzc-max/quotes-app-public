<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>quotes · 金句库</title>
<link rel="stylesheet" href="/vendor/vditor/dist/index.css">
<style>
:root{
  --paper:#F3F1EC;
  --ink:#121212;
  --red:#E2231A;

  --bg:var(--paper);
  --fg:var(--ink);
  --hair:rgba(18,18,18,.22);
  --rule:rgba(18,18,18,.13);
  --mute:rgba(18,18,18,.5);
  --ink2:rgba(18,18,18,.7);

  --gut:clamp(14px,3.2vw,46px);
  --bar:clamp(48px,6.2vh,62px);
  --hangroom:clamp(6px,1.4vw,20px);
  --btnh:28px;
  --font:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
html[data-theme="red"]{
  --bg:var(--red); --fg:#fff;
  --hair:rgba(255,255,255,.42);
  --rule:rgba(255,255,255,.3);
  --mute:rgba(255,255,255,.7);
  --ink2:rgba(255,255,255,.84);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow:hidden;
  transition:background-color .3s ease,color .3s ease;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

/* 微排版：中英间隙 / 拉丁·数字收紧 / 标点挤压 / 分词不劈词 */
.gap{display:inline-block;width:.14em}
.lat{letter-spacing:-.02em}
.dg{letter-spacing:-.008em;font-variant-numeric:tabular-nums}
.pc.l{margin-left:-.36em}
.pc.r{margin-right:-.36em}
.w{white-space:nowrap}

/* ---------- shared bar ---------- */
.bar{display:flex;align-items:center;padding:0 var(--gut);gap:clamp(8px,1.4vw,18px);min-width:0;position:relative;z-index:2}
.ihead.bar.top{border-bottom:1px solid var(--hair)}
.spacer{flex:1 1 auto;min-width:0}
.wordmark{display:flex;align-items:baseline;flex:none}
.wordmark b{font-size:clamp(13px,1.25vw,16px);font-weight:700;letter-spacing:0}

/* 按钮统一规格：描边一种高度，海报「复制」是唯一实心 */
.tag{
  flex:none;display:inline-flex;align-items:center;justify-content:center;
  height:var(--btnh);padding:0 12px;
  font-size:11px;letter-spacing:0;line-height:1;
  border:1px solid var(--hair);white-space:nowrap;
  transition:background-color .15s ease,color .15s ease,border-color .15s ease;
}
button.tag:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.tag[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.tag[disabled]{opacity:.4;cursor:default}
button.tag[disabled]:hover{background:none;color:inherit;border-color:var(--hair)}

.chip-filter{border-color:var(--hair);color:var(--ink2);gap:.7em}
html[data-theme="red"] .chip-filter{color:var(--fg)}
.chip-filter .x{font-size:13px;line-height:1;opacity:.8}

.hbtn{
  flex:none;width:var(--btnh);height:var(--btnh);border:1px solid var(--hair);
  color:var(--mute);font-size:11px;line-height:1;display:inline-flex;align-items:center;justify-content:center;
  transition:color .15s ease,border-color .15s ease;
}
.hbtn:hover{color:var(--fg);border-color:var(--fg)}

/* ================= INDEX ================= */
#index{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column}
.ihead{height:var(--bar);flex:none;background:var(--bg)}
.sbox{display:flex;align-items:center;gap:.7em;flex:0 1 auto;min-width:0;border-bottom:1px solid var(--hair);padding-bottom:4px;transition:border-color .15s ease}
.sbox:focus-within{border-bottom-color:var(--fg)}
.sbox input{width:clamp(120px,24vw,340px);min-width:0;font-size:clamp(13px,1.2vw,16px);letter-spacing:0;-webkit-appearance:none;appearance:none}
.sbox input:focus,.sbox input:focus-visible{outline:none}
.sbox input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.sbox input::placeholder{color:var(--mute)}

#iscroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;z-index:1}
.isheet{display:grid;grid-template-columns:repeat(12,1fr);padding:clamp(16px,2.6vh,30px) var(--gut) 18vh}
.rail{grid-column:1 / span 2;position:sticky;top:0;align-self:start;padding-right:clamp(10px,1.8vw,30px);min-width:0}
.rlab{font-size:10px;letter-spacing:0;color:var(--mute);margin:0 0 8px}
.rsep{height:1px;background:var(--rule);margin:12px 0}
.rbtn{
  position:relative;display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%;
  padding:5px 0 5px 12px;text-align:left;color:var(--ink2);
  font-size:clamp(12px,1.05vw,14px);letter-spacing:0;line-height:1.5;
  transition:color .15s ease;
}
.rbtn .n{flex:none;font-size:10px;letter-spacing:.06em;color:var(--mute);font-variant-numeric:tabular-nums}
.rbtn:hover{color:var(--ink)}
.rbtn[aria-pressed="true"]{color:var(--ink);font-weight:700}
.rbtn[aria-pressed="true"] .n{color:var(--ink)}
.rbtn[aria-pressed="true"]::before{content:"";position:absolute;left:0;top:.38em;bottom:.38em;width:2px;background:var(--ink)}
.rbtn .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rbtn.zero{opacity:.32}

.list{grid-column:3 / span 10;align-self:start;position:relative;border-top:1px solid var(--rule);min-width:0}
.row{
  position:relative;display:grid;
  grid-template-columns:8% minmax(0,1fr) clamp(190px,27%,330px);
  align-items:baseline;background:var(--bg);
  padding:clamp(13px,1.7vh,19px) 0;border-bottom:1px solid var(--rule);
  cursor:pointer;transition:background-color .12s ease;
}
.row:hover{background:#EBE9E3}
.row.cur{background:#E8E5DE}
.row.cur::after{content:"";position:absolute;left:0;top:-1px;bottom:-1px;width:2px;background:var(--ink)}
/* 置顶组 / 时间序组之间的分区 */
.row.lastpin{border-bottom:2px solid var(--hair);margin-bottom:clamp(20px,3vh,34px)}

.rn{padding-left:clamp(12px,1.9vw,30px);padding-right:14px;cursor:pointer}
.nw{
  position:relative;display:inline-block;padding:2px 5px;
  font-size:clamp(11px,.92vw,13px);font-weight:500;letter-spacing:.06em;line-height:1.25;
  font-variant-numeric:tabular-nums;
}
.nw .fill{
  position:absolute;left:0;top:0;right:0;bottom:0;
  background:var(--red);transform:scaleX(0);transform-origin:left center;
  transition:transform .25s cubic-bezier(.3,.72,.3,1);
}
.nw.on .fill{transform:scaleX(1);transform-origin:left center}
.nw.off .fill{transform:scaleX(0);transform-origin:right center}
.nw .t{position:relative;z-index:1;color:var(--mute);transition:color .16s ease .07s}
.nw.on .t{color:#fff}
.row:hover .nw:not(.on) .t,.row.cur .nw:not(.on) .t{color:var(--ink)}

.rb{min-width:0;padding-right:clamp(14px,2vw,34px);display:flex;align-items:baseline;gap:.55em}
.rq{
  min-width:0;padding-left:clamp(14px,1.6vw,26px);
  font-size:clamp(14px,1.18vw,17px);line-height:1.62;font-weight:500;
  overflow-wrap:break-word;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;
}
.rq.hang{text-indent:-.42em}
.rq i{font-style:italic}
.rq b{font-weight:700}
.rq code{font-family:inherit;box-shadow:inset 0 -.28em 0 rgba(18,18,18,.13);padding:0 .12em}
/* 搜索结果 ≤3 条：整条展开 */
.rq.full{display:block;-webkit-line-clamp:none;line-clamp:none;overflow:visible}
.rq p{margin:0}
.rq p+p{margin-top:.5em}
.rq p.hang{text-indent:-.42em}
/* 后文：灰字顺排在首句后面。首句一行放得下 → 整行只占一行（.one）；首句自己就折行 → 保持两行 */
/* 行尾省略号取容器的颜色与字重，所以容器本身设成灰/常规，首句再单独提回黑/中粗 —— 省略号才会和后文一样是灰的 */
.rq:not(.full){color:rgba(18,18,18,.4);font-weight:400}
.rq:not(.full) .lead{color:var(--ink);font-weight:500}
.rq.hl:not(.full) .lead{color:inherit}
.rq .rest{margin-left:.5em}
.rq.one{-webkit-line-clamp:1;line-clamp:1}
/* hover 时正文右侧的复制提示 */
/* 命中：加粗；非命中降中灰（红只留给置顶） */
mark{background:none;color:var(--ink);font-weight:700}
.hl{color:rgba(18,18,18,.46)}

/* 右侧：出处 · 用途 一行 + 仅聚焦/hover 显示的操作 */
.rmeta{position:relative;display:flex;align-items:baseline;gap:clamp(10px,1.4vw,22px);padding-right:clamp(6px,1vw,16px);min-width:0}
.mtxt{
  flex:0 1 auto;min-width:0;display:flex;align-items:baseline;white-space:nowrap;overflow:hidden;
  font-size:11px;line-height:1.5;letter-spacing:0;color:var(--mute);
}
/* 窄窗口下只截长出处，用途始终完整显示 */
.mtxt > span:not(.uc){flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mtxt.hang{text-indent:-.42em}
.mtxt .uc{flex:none;text-indent:0;color:rgba(18,18,18,.32)}
/* 非聚焦行的操作不占位，把宽度让给出处；聚焦/hover 时才出现 */
.acts{flex:none;margin-left:auto;display:none;gap:.95em;white-space:nowrap}
.row:hover .acts,.row.cur .acts,.row:focus-within .acts{display:flex}
.acts button{
  font-size:11px;letter-spacing:0;color:rgba(18,18,18,.55);cursor:pointer;
  border-bottom:1px solid transparent;padding-bottom:1px;transition:color .15s ease;
}
.acts button:hover{color:var(--ink);border-bottom-color:var(--ink)}
/* 原位反馈：元数据位置短暂换成「已复制」 */
.cflash{
  position:absolute;left:0;top:0;display:none;
  font-size:11px;line-height:1.5;letter-spacing:0;color:var(--ink);white-space:nowrap;
}
.row.copied .cflash{display:block}
.row.copied .mtxt,.row.copied .acts{visibility:hidden}
.inone{padding:clamp(34px,8vh,80px) 0 0 clamp(12px,1.9vw,30px);font-size:clamp(28px,7vw,72px);font-weight:700;letter-spacing:-.04em}

/* ================= POSTER ================= */
#app{position:relative;z-index:2;height:100dvh;display:grid;grid-template-rows:var(--bar) 1fr var(--bar)}
#stage{
  position:relative;min-height:0;display:grid;
  grid-template-columns:clamp(96px,11vw,168px) 1fr;
  gap:clamp(10px,2vw,32px);
  padding:clamp(14px,2.6vh,32px) var(--gut) clamp(10px,2vh,26px);
}
.marker{display:flex;flex-direction:column;min-height:0;min-width:0;align-items:flex-start;overflow:hidden}
.marker .m{
  display:block;max-width:100%;text-align:left;
  font-size:11px;line-height:1.5;letter-spacing:0;color:var(--mute);
  overflow-wrap:anywhere;
}
.marker .m+.m{margin-top:.4em}
.marker .no{font-variant-numeric:tabular-nums;letter-spacing:.06em}
.marker .dt{font-variant-numeric:tabular-nums;letter-spacing:.04em}
.marker button.m{cursor:pointer;transition:color .15s ease}
.marker button.m:hover{color:var(--fg)}

.field{display:flex;flex-direction:column;min-width:0;min-height:0}
.quote{
  flex:1 1 auto;min-height:0;overflow:hidden;position:relative;
  display:flex;flex-direction:column;justify-content:flex-start;
  margin-left:calc(-1 * var(--hangroom));
  padding-left:var(--hangroom);
  padding-right:2px;
}
.quote.ovf{overflow-y:auto;scrollbar-width:thin}
#qt{
  width:100%;font-weight:700;letter-spacing:0;
  overflow-wrap:break-word;--pgap:.4em;
  animation:rise .34s cubic-bezier(.2,.7,.2,1) both;
}
#qt p{margin:0}
#qt p+p{margin-top:var(--pgap)}
#qt b{font-weight:700}
#qt i{font-style:italic}
#qt code{font-family:inherit;padding:0 .18em;box-shadow:inset 0 -.28em 0 rgba(18,18,18,.16)}
html[data-theme="red"] #qt code{box-shadow:inset 0 -.28em 0 rgba(255,255,255,.28)}
#qt p.hang{text-indent:max(calc(-1 * var(--hangroom)),-.42em)}
/* 大字：断行由语义排版引擎决定，每行一个 .ln */
#qt .lead .ln{display:block;text-indent:0;white-space:nowrap}
#qt .lead .ln.hang{text-indent:max(calc(-1 * var(--hangroom)),-.42em)}
#qt .rest{
  font-size:clamp(17px,1.5vw,22px);line-height:1.66;font-weight:500;letter-spacing:0;
  margin-top:1.1em;text-wrap:pretty;color:var(--ink2);max-width:32em;
}
#qt .rest p+p{margin-top:.62em}
#qt .rest p.hang{text-indent:-.44em}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.empty-poster{display:flex;flex-direction:column;justify-content:flex-start;height:100%}
.empty-poster .big{font-size:clamp(46px,11vw,150px);font-weight:700;letter-spacing:-.04em;line-height:.9}
.empty-poster .slash{display:block;width:clamp(80px,22vw,320px);height:6px;background:var(--fg);margin-top:.5em}

.pin-toggle{
  flex:none;display:inline-flex;align-items:center;justify-content:center;
  height:var(--btnh);padding:0 12px;border:1px solid var(--hair);
  font-size:11px;letter-spacing:0;line-height:1;color:var(--mute);
  transition:color .15s ease,border-color .15s ease;
}
.pin-toggle:hover{color:var(--fg);border-color:var(--fg)}
.pin-toggle[aria-pressed="true"]{color:var(--fg);border-color:var(--fg)}
.btn-copy{
  flex:none;display:inline-flex;align-items:center;justify-content:center;
  height:var(--btnh);padding:0 18px;border:1px solid var(--fg);
  background:var(--fg);color:var(--bg);
  font-size:11px;letter-spacing:0;line-height:1;transition:opacity .15s ease;
}
.btn-copy:hover{opacity:.84}
.nav{display:flex;gap:2px;flex:none}
.nav button{
  width:clamp(28px,2.8vw,34px);height:clamp(24px,2.8vh,30px);
  display:grid;place-items:center;font-size:15px;line-height:1;
  color:var(--mute);transition:color .15s ease;
}
.nav button:hover{color:var(--fg)}
.nav button[disabled]{opacity:.25;cursor:default}
.nav button[disabled]:hover{color:var(--mute)}

/* ================= COMPOSE ================= */
#compose{
  position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;
  background:var(--paper);color:var(--ink);
  --bg:var(--paper);--fg:var(--ink);
  --hair:rgba(18,18,18,.22);--mute:rgba(18,18,18,.5);
}
#compose .chead{height:var(--bar);flex:none;display:flex;align-items:center;gap:14px;padding:0 var(--gut);border-bottom:1px solid var(--ink)}
#compose .cbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:clamp(14px,2.4vh,28px) var(--gut) clamp(12px,2vh,22px)}
#cbox{flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column}
#cedit{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}

/* Vditor 压进本设计的语言：零圆角 / 发丝线 / 系统无衬线 / 无彩色强调 */
#cbox .vditor{
  --border-color:rgba(18,18,18,.22);
  --second-color:rgba(18,18,18,.36);
  --panel-background-color:#F3F1EC;
  --panel-shadow:none;
  --toolbar-background-color:transparent;
  --toolbar-icon-color:rgba(18,18,18,.42);
  --toolbar-icon-hover-color:#121212;
  --toolbar-height:32px;
  --textarea-background-color:transparent;
  --textarea-text-color:#121212;
  --count-background-color:transparent;
  --heading-border-color:rgba(18,18,18,.13);
  --blockquote-color:rgba(18,18,18,.5);
  --ir-heading-color:#121212;
  --ir-title-color:rgba(18,18,18,.38);
  --ir-bi-color:#121212;
  --ir-link-color:#121212;
  --ir-bracket-color:rgba(18,18,18,.38);
  --ir-paren-color:rgba(18,18,18,.38);
  height:100%!important;border-radius:0!important;
  font-family:var(--font)!important;background:transparent;
}
#cbox .vditor-toolbar{border-bottom:1px solid var(--rule)!important;border-radius:0!important;padding:0 2px!important}
#cbox .vditor-toolbar__item button{border-radius:0!important}
#cbox .vditor-toolbar__divider{border-left:1px solid var(--rule)}
#cbox .vditor-content{flex:1 1 auto;min-height:0;border-radius:0!important}
#cbox .vditor-reset{font-family:var(--font)!important;font-size:15px!important;line-height:1.72!important;color:var(--ink)!important;word-break:break-word}
#cbox .vditor-ir pre.vditor-reset{padding:14px 2px!important;background:transparent!important}
#cbox .vditor-reset blockquote{border-left:2px solid var(--hair)!important;color:rgba(18,18,18,.55)!important}
#cbox .vditor-reset h1,#cbox .vditor-reset h2,#cbox .vditor-reset h3,
#cbox .vditor-reset h4,#cbox .vditor-reset h5,#cbox .vditor-reset h6{border-bottom:0!important;font-weight:700}
#cbox .vditor-reset a{color:var(--ink)!important;text-decoration:underline}
#cbox .vditor-tooltipped::after{border-radius:0!important;font-size:11px}
#cbox .vditor-panel{border-radius:0!important;box-shadow:none!important;border:1px solid var(--hair)}
#cbox .vditor-resize{display:none!important}
#compose .cfoot{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:clamp(8px,1.4vw,18px);padding:clamp(12px,2vh,22px) var(--gut);border-top:1px solid var(--hair)}
.fld{display:flex;align-items:baseline;gap:.7em;border-bottom:1px solid var(--hair);padding-bottom:5px;min-width:0;transition:border-color .15s ease}
.fld:focus-within{border-bottom-color:var(--ink)}
.fld label{font-size:11px;letter-spacing:0;color:var(--mute);flex:none}
.fld input{font-size:clamp(13px,1.2vw,16px);font-weight:500;min-width:0;width:clamp(110px,16vw,220px);-webkit-appearance:none;appearance:none}
.fld input:focus,.fld input:focus-visible{outline:none}
.fld input::-webkit-calendar-picker-indicator{display:none!important}
.fld input::placeholder{color:rgba(18,18,18,.25)}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;height:var(--btnh);background:var(--ink);color:#fff;border:1px solid var(--ink);padding:0 16px;font-size:11px;letter-spacing:0;line-height:1}
.btn-primary:hover{background:#000;border-color:#000}

/* ================= help ================= */
#help{position:fixed;inset:0;z-index:12;background:rgba(18,18,18,.48);display:flex;align-items:center;justify-content:center;padding:var(--gut)}
.hcard{background:var(--paper);color:var(--ink);border:1px solid rgba(18,18,18,.85);padding:clamp(18px,3vh,28px) clamp(20px,3vw,34px);width:100%;max-width:380px}
.httl{font-size:10px;letter-spacing:.08em;color:rgba(18,18,18,.5);margin-bottom:12px}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:7px 0;border-bottom:1px solid rgba(18,18,18,.1);font-size:13px}
.hrow:last-child{border-bottom:0}
.hrow b{font-weight:500;font-size:11px;letter-spacing:.08em;color:rgba(18,18,18,.55)}

/* ================= 状态行（全站唯一消息位） ================= */
#status{
  position:fixed;left:var(--gut);bottom:calc(var(--bar) + 16px);z-index:20;
  max-width:min(62vw,520px);
  font-size:11px;line-height:1.5;letter-spacing:0;color:var(--mute);
  opacity:0;pointer-events:none;transition:opacity .18s ease;
}
#status.show{opacity:1}
#status .sbar{display:none;height:1px;background:var(--rule);margin-top:6px}
#status .sbar.on{display:block}
#status .sbar i{display:block;height:100%;width:0;background:var(--fg);transition:width .2s ease}

/* ================= 更新横幅 ================= */
/* 放底部居中：放顶部会压住搜索框右端 */
#ubar{
  position:fixed;bottom:0;left:50%;transform:translate(-50%,110%);z-index:24;
  display:flex;align-items:center;gap:14px;
  background:#121212;color:#F3F1EC;padding:9px 16px;
  font-size:11px;letter-spacing:0;line-height:1;
  transition:transform .24s ease;
}
#ubar.show{transform:translate(-50%,0)}
#ubar b{font-weight:500;font-variant-numeric:tabular-nums}
#ubar button{
  font-size:11px;line-height:1;color:rgba(243,241,236,.7);
  border-bottom:1px solid transparent;padding-bottom:1px;transition:color .15s ease;
}
#ubar button:hover{color:#fff;border-bottom-color:#fff}

function gapAdj(a,b){
  var x=a.t.charAt(a.t.length-1), y=b.t.charAt(0);

}

function squeezeEm(A,i,j){
  var s=0, f=A[i].t.charAt(0), l=A[j].t, lc=l.charAt(l.length-1);

  if(isSq(lc)) s+=0.36;

}
/* 避头：单字虚词不许起行 */
var HEADBAN='了的地得着过吗呢吧啊呀和与或及就都也';
function headBan(a){ return !!a && a.t.length===1 && HEADBAN.indexOf(a.t)>=0; }
/* 相邻两个单字多半是分词器没合上的一个词（挂/错、车/灯），别在中间断 */
function one(a){ return !!a && a.t.length===1 && CJK.test(a.t); }
function glued(A,j){ return one(A[j]) && one(A[j+1]); }

  var a=A[j], c=a.t.charAt(a.t.length-1), v;

}
/* 断点质量（用于跨字号比较方案）：标点后最优，词边界最差 */
function brkLoss(A,j){
  var c=A[j].t.charAt(A[j].t.length-1), v;
  if(STRONG.indexOf(c)>=0) v=0;
  else if(WEAK.indexOf(c)>=0) v=.02;

function lineText(A,i,j){ var s='',k; for(k=i;k<=j;k++) s+=A[k].t+((k<j&&A[k].sp)?' ':''); return s; }
function visLen(s){ return s.replace(/\s/g,'').length; }

  var w=0,k;

    if(k>i) w += (A[k-1].sp? spaceEm() : gapAdj(A[k-1],A[k]));

function breakLines(A,limit){
  var n=A.length; if(!n) return [];

  best[n]=0;
  for(i=n-1;i>=0;i--){
    best[i]=Infinity; nxt[i]=i; w=0;
    for(j=i;j<n;j++){
      if(j>i) w += (A[j-1].sp? spaceEm() : gapAdj(A[j-1],A[j]));
      w += A[j].w;
      lw = w - squeezeEm(A,i,j);
      if(lw>limit && j>i) break;
      if(j===n-1){
        pen=0;                                                 /* 末行孤字 / 寡词重罚 */
        if(i>0 && (visLen(lineText(A,i,j))<=2 || (i===j && lw<limit*0.3))) pen=8000;
        if(lw>limit) pen+=4000;
      }else{

        if(lw>limit) pen+=4000;

/* 墨迹左缘相对字框左缘的偏移（em），用于光学对齐补偿 */
var INKC={}, INKCV=null;
function inkLeftEm(ch,weight){

    if(!INKCV) INKCV=document.createElement('canvas');
    var cx=INKCV.getContext('2d');

function firstCh(s){ s=String(s).replace(/^\s+/,''); return s.charAt(0); }

/* highlight matches inside an already-rendered node */
function hilite(rootNode, q){
  if(!q||!rootNode) return 0;
  var rx = new RegExp(rxEsc(q),'gi');
  var w = document.createTreeWalker(rootNode, NodeFilter.SHOW_TEXT, null, false);
  var nodes=[], n, hits=0;
  while((n=w.nextNode())) nodes.push(n);
  nodes.forEach(function(node){
    var t=node.nodeValue; rx.lastIndex=0;
    if(!rx.test(t)) return;
    rx.lastIndex=0;
    var frag=document.createDocumentFragment(), last=0, m;
    while((m=rx.exec(t))){
      if(!m[0].length){ rx.lastIndex++; continue; }
      if(m.index>last) frag.appendChild(document.createTextNode(t.slice(last,m.index)));
      var el=document.createElement('mark'); el.textContent=m[0];
      frag.appendChild(el); hits++;
      last=m.index+m[0].length;

    if(last<t.length) frag.appendChild(document.createTextNode(t.slice(last)));
    node.parentNode.replaceChild(frag,node);

}

    if(seen[b]!==seen[a]) return seen[b]-seen[a];

/* ---------- 海报大字：语义断行 + 光学左对齐 ---------- */
var twoTier=false;
var POSTER={segs:null,leadEl:null,restEl:null,nPara:0};
function lhOf(px){ return px>110?1.02:px>70?1.08:px>44?1.18:px>26?1.30:1.45; }
function pgOf(px){ return px>60?0.34:px>34?0.45:0.62; }
function buildSegs(paras){
  var SEGS=[], all=[];
  paras.forEach(function(p,pi){
    String(p).split('\n').forEach(function(s){
      s=s.trim(); if(!s) return;
      var atoms=atomize(inline(s));
      if(!atoms.length) return;
      SEGS.push({p:pi,atoms:atoms});
      all=all.concat(atoms);
    });
  });
  measureAtoms(all);
  return SEGS;
}
function paintLead(lead,SEGS,plan,fs,capPx){
  lead.innerHTML='';
  var lastP=-1, P=null;
  SEGS.forEach(function(S,si){
    if(S.p!==lastP){ P=document.createElement('p'); lead.appendChild(P); lastP=S.p; }
    plan[si].forEach(function(rng,li){
      var ln=document.createElement('span');
      ln.className='ln'+((li===0 && isOpen(S.atoms[rng[0]].t))?' hang':'');
      /* 光学补偿：每行按自己首字的左边距回拉，墨迹落到同一条竖线上 */
      ln.style.marginLeft=(-Math.min(capPx,inkLeftEm(firstCh(S.atoms[rng[0]].t),'700')*fs))+'px';
      var j=rng[0], wrap, txt, el;
      while(j<=rng[1]){
        wrap=S.atoms[j].wrap; txt='';
        while(j<=rng[1] && S.atoms[j].wrap===wrap){
          txt+=S.atoms[j].t+((j<rng[1]&&S.atoms[j].sp)?' ':'');
          j++;
        }
        if(wrap){ el=document.createElement(wrap); el.textContent=txt; ln.appendChild(el); }
        else ln.appendChild(document.createTextNode(txt));
      }
      typesetLines(ln,{gap:true,squeeze:true});

    });

}
function hasOrphan(plan,SEGS,wide){
  var i,lines,last,A;
  for(i=0;i<plan.length;i++){
    lines=plan[i];
    if(lines.length<2) continue;
    last=lines[lines.length-1]; A=SEGS[i].atoms;
    if(visLen(lineText(A,last[0],last[1]))<=2) return true;
    if(last[0]===last[1] && lineWEm(A,last[0],last[1])<wide*0.3) return true;
  }

}
function layoutPoster(){
  var SEGS=POSTER.segs, lead=POSTER.leadEl;
  if(!SEGS||!SEGS.length||!lead) return;
  qtBox.classList.remove('ovf');
  var bs=getComputedStyle(qtBox);
  var padL=parseFloat(bs.paddingLeft)||0, padR=parseFloat(bs.paddingRight)||0;
  var CW=qtBox.clientWidth-padL-padR, H=qtBox.clientHeight;
  if(CW<20||H<20) return;

  var restH=0;
  if(POSTER.restEl){
    var rs=getComputedStyle(POSTER.restEl);
    var rfs=parseFloat(rs.fontSize)||18;
    POSTER.restEl.style.marginLeft =
      (-Math.min(padL, inkLeftEm(firstCh(POSTER.restEl.textContent),'500')*rfs))+'px';
    rs=getComputedStyle(POSTER.restEl);
    restH=POSTER.restEl.offsetHeight+(parseFloat(rs.marginTop)||0);
  }
  var HA=Math.max(24,H-restH);
  /* 每行各自补偿，宽度预算按最小的那一档算，才保证没有一行会顶出去 */
  var inkEm=1, si, ai;
  for(si=0;si<SEGS.length;si++)
    for(ai=0;ai<SEGS[si].atoms.length;ai++)
      inkEm=Math.min(inkEm, inkLeftEm(firstCh(SEGS[si].atoms[ai].t),'700'));
  if(!(inkEm>=0)) inkEm=0;
  var minPx=twoTier?30:15, capPx=340;

  function planAt(fs,tight){
    var comp=Math.min(padL, inkEm*fs), limit=(CW+comp)/fs*(tight||1);
    var pl=[], lines=0, wide=0, loss=1, ws=[], i, j, lw;
    for(i=0;i<SEGS.length;i++){
      pl.push(breakLines(SEGS[i].atoms,limit));
      lines+=pl[i].length;
      for(j=0;j<pl[i].length;j++){
        lw=lineWEm(SEGS[i].atoms,pl[i][j][0],pl[i][j][1]);
        if(lw>wide) wide=lw;
        if(j<pl[i].length-1){ loss*=(1-brkLoss(SEGS[i].atoms,pl[i][j][1])); ws.push(lw); }
      }
    }
    for(i=0;i<ws.length;i++) loss*=(0.8+0.2*(wide? ws[i]/wide:1));   /* 非末行留白太多也扣分 */
    return { plan:pl, comp:comp, wide:wide, qual:loss,
             h:lines*fs*lhOf(fs)+(POSTER.nPara-1)*fs*pgOf(fs) };
  }
  /* 方案先定，字号后算：把该方案的最长一行顶到右边距，再按高度收 */
  function settle(fs0,HAx,tight){
    var fs=fs0, r, k;
    for(k=0;k<3;k++){
      r=planAt(fs,tight);
      if(!(r.wide>0)) break;
      fs=Math.min(capPx,(CW+r.comp)/r.wide*0.995);
      if(fs<minPx){ fs=minPx; break; }
    }
    r=planAt(fs,tight);
    for(k=0;k<8 && r.h>HAx && fs>minPx;k++){
      fs=Math.max(minPx,fs*Math.min(0.97,HAx/r.h));
      r=planAt(fs,tight);
    }
    if(r.h>HAx+0.5) return null;
    return { fs:fs, r:r, score:fs*r.qual*(hasOrphan(r.plan,SEGS,r.wide)?0.02:1) };
  }
  function scan(HAx,tight){
    var best=null, c, k;
    for(k=0;k<=48;k++){
      c=settle(minPx*Math.pow(capPx/minPx,k/48),HAx,tight);
      if(c && (!best || c.score>best.score+0.01)) best=c;
    }
    return best;
  }
  function apply(fs,res){
    applySize(qt,fs);
    paintLead(lead,SEGS,res.plan,fs,padL);
  }
  /* 模型与实测总有零点几 em 的差（行盒内容区比 line-height 高）：
     实测超了就把预算改小重算方案，而不是盲目缩字号——盲缩会把标点断点挤没 */
  lead.style.marginLeft='0px';             /* 补偿下放到每一行 */
  var HAeff=HA, tight=1, best=null, dh, dw, k;
  for(k=0;k<5;k++){
    best=scan(HAeff,tight) || {fs:minPx,r:planAt(minPx,tight)};
    apply(best.fs,best.r);
    dh=qt.scrollHeight-H;
    /* 行尾标点是有意挤出去的（.pc.r 负 margin 不计入 scrollWidth），容差 .37em */
    dw=lead.scrollWidth-lead.clientWidth-0.37*best.fs;
    if(dh<=0.5 && dw<=0.5) break;
    if(dh>0.5) HAeff=Math.max(40,HAeff-Math.max(3,dh));
    if(dw>0.5) tight*=0.97;
  }
  if(qt.scrollHeight>H+0.5) qtBox.classList.add('ovf');
}

function renderPoster(animate){

/* ================= 壁纸 =================
   把当前海报画到 canvas（按所在屏幕的物理像素），POST 给 server 落盘并设为桌面。
   所见即所得：置顶 = 红底白字，未置顶 = 纸底黑字；大字用的正是海报已经断好的行。 */
function wrapText(x,text,maxw){
  /* 中文逐字、拉丁按词的贪心换行；行首不放收尾标点 */
  var toks=[], re=/[A-Za-z0-9][A-Za-z0-9'’\-]*\s*|\s+|./g, m;
  while((m=re.exec(text))) toks.push(m[0]);
  var lines=[], cur='';
  var CLOSE='，。、；：？！）】》」』…,.;:?!)]}';
  toks.forEach(function(t){
    if(t==='\n'){ lines.push(cur); cur=''; return; }
    var trial=cur+t;
    if(cur && x.measureText(trial.replace(/\s+$/,'')).width>maxw && CLOSE.indexOf(t.charAt(0))<0){ lines.push(cur.replace(/\s+$/,'')); cur=t.replace(/^\s+/,''); }
    else cur=trial;
  });
  if(cur.trim()) lines.push(cur.replace(/\s+$/,''));
  return lines;
}
function renderWallpaper(q){
  var dpr=window.devicePixelRatio||1;
  var W=Math.round((screen.width||1920)*dpr), H=Math.round((screen.height||1080)*dpr);
  /* 红底/纸底画在 body 上（html[data-theme=red] 切 --bg），海报元素本身是透明的 */
  var bg=getComputedStyle(document.body).backgroundColor, fg=getComputedStyle(qt).color, fam=getComputedStyle(qt).fontFamily;
  if(!bg||bg==='rgba(0, 0, 0, 0)'||bg==='transparent') bg=getComputedStyle(document.documentElement).backgroundColor;
  var lines=[].slice.call(qt.querySelectorAll('.lead .ln')).map(function(l){ return l.textContent; }).filter(Boolean);
  if(!lines.length) lines=[(q.plain||'').split('\n')[0]];
  var restEl=qt.querySelector('.rest'), paras=[];
  if(restEl){
    var ps=restEl.querySelectorAll('p');
    paras=(ps.length? [].map.call(ps,function(e){ return e.textContent.trim(); }) : restEl.textContent.split('\n')).filter(Boolean);
  }
  var rest=paras.length>0;
  var c=document.createElement('canvas'); c.width=W; c.height=H;
  var x=c.getContext('2d');
  x.fillStyle=bg; x.fillRect(0,0,W,H);
  /* 版心：左右 7.5%，上下 11%（避开菜单栏 / Dock，也给 16:10 与 16:9 之间的裁切留余量） */
  var ml=Math.round(W*.075), mt=Math.round(H*.11), cw=W-2*ml, ch=H-2*mt;
  x.font='700 100px '+fam;
  var maxw=0; lines.forEach(function(t){ maxw=Math.max(maxw, x.measureText(t).width); });
  var f=Math.min(cw/maxw*100, H*.2), lh=1.14;
  var f2=0, gap=0, rl=[], rlh=1.6;
  function layout(){
    var h=lines.length*f*lh;
    rl=[]; f2=0; gap=0;
    if(rest){
      f2=Math.max(f*.24, H*.018); gap=f*.55;
      x.font='500 '+f2+'px '+fam;
      rl=[];
      paras.forEach(function(pt,i){ if(i) rl.push(''); rl=rl.concat(wrapText(x, pt, Math.min(cw, f2*32))); });
      if(rl.length>14){ rl=rl.slice(0,14); rl[13]=rl[13].replace(/[，,、；;]$/,'')+'…'; }   /* 壁纸不是阅读器，正文封顶 14 行 */
      h+=gap+rl.length*f2*rlh;
    }
    return h;
  }
  var total=layout();
  if(total>ch){ f*=ch/total; total=layout(); }
  var y=mt+(ch-total)/2;
  x.fillStyle=fg; x.textBaseline='top';
  x.font='700 '+f+'px '+fam;
  lines.forEach(function(t){ x.fillText(t, ml, y); y+=f*lh; });
  if(rest){
    y+=gap; x.font='500 '+f2+'px '+fam; x.globalAlpha=.82;
    rl.forEach(function(t){ if(t) x.fillText(t, ml, y); y+=f2*(t? rlh : rlh*.45); });
    x.globalAlpha=1;
  }
  var meta=[q.source, q.use_case].filter(function(v,i,a){ return v && a.indexOf(v)===i; }).join('　');
  if(meta){
    var f3=Math.max(H*.016, 14*dpr);
    x.font='500 '+f3+'px '+fam; x.globalAlpha=.6; x.textBaseline='bottom';
    x.fillText(meta, ml, H-mt); x.globalAlpha=1;
  }
  return c;
}

/* 红块填满 → FLIP 把该行送进置顶区；取消则反向 */
function flipReorder(prev){
  var rows=listEl.querySelectorAll('.row'), moved=[], k, el, p, d;
  for(k=0;k<rows.length;k++){
    el=rows[k]; p=prev[el.getAttribute('data-id')];
    if(p==null) continue;
    d=p-el.getBoundingClientRect().top;
    if(Math.abs(d)<1) continue;
    el.style.transform='translateY('+d+'px)';
    moved.push(el);
  }
  if(!moved.length) return;
  listEl.getBoundingClientRect();
  moved.forEach(function(e){
    e.style.transition='transform .42s cubic-bezier(.22,.7,.2,1)';
    e.style.transform='';
  });
  setTimeout(function(){
    moved.forEach(function(e){ e.style.transition=''; e.style.transform=''; });

  },470);
}

    .then(function(r){

      var q=byId(id);
      if(q && r.quote){ q.pinned=!!r.quote.pinned; }
      return true;

    .catch(function(e){

var vditor=null, vditorReady=false, editingId=null, editingBase=null, saving=false;
function ensureEditor(initial){
  var val=initial||'';
  if(vditor){
    if(vditorReady) vditor.setValue(val);
    else vditor.__pending=val;          /* 还在 init：先存着，after 回调里设 */
    return;
  }
  vditor=new Vditor('cedit',{
    mode:'ir',
    cdn:location.origin+'/vendor/vditor',
    height:'100%',
    minHeight:200,
    placeholder:'写下这一句……（打 1. 或 - 再空格，自动列表）',
    toolbar:['headings','bold','italic','strike','|','list','ordered-list','check','quote','line','|','undo','redo'],
    cache:{enable:false},
    counter:{enable:false},
    after:function(){
      vditorReady=true;
      vditor.setValue(vditor.__pending!=null? vditor.__pending : val);
      vditor.__pending=null;
      try{ vditor.focus(); }catch(e){}
    }
  });
}
function editorValue(){
  try{ return (vditor&&vditorReady)? vditor.getValue() : ''; }catch(e){ return ''; }
}
/* 用途候选 = 库里现有用途 ∪ 固定五个 */
function fillUseList(){

  dl.innerHTML='';
  useCases().order.forEach(function(u){ if(u&&!seen[u]){ seen[u]=1; out.push(u); } });
  UC_FIXED.forEach(function(u){ if(!seen[u]){ seen[u]=1; out.push(u); } });
  out.forEach(function(u){ var o=document.createElement('option'); o.value=u; dl.appendChild(o); });
}
function openCompose(id){
  var q = id? byId(id) : null;

  editingId = q? q.id : null;
  editingBase = q? (q.updated_at||q.created_at||null) : null;
  state.back=state.view;
  if(state.view==='index') state.scroll=iscroll.scrollTop;
  composeEl.hidden=false; composeEl.setAttribute('aria-hidden','false');
  cTitle.textContent = q? '编辑' : '新增';
  $('cSave').textContent = q? '保存' : '存入';
  cSrc.value = q? q.source : '';
  cUse.value = q? q.use_case : '';
  fillUseList();
  ensureEditor(q? q.text : '');          /* 编辑用原始 Markdown */
  setTimeout(function(){ try{ vditor&&vditor.focus(); }catch(e){} },220);
}
function resetCompose(){
  composeEl.hidden=true; composeEl.setAttribute('aria-hidden','true');
  editingId=null; editingBase=null;
  if(vditor&&vditorReady){ try{ vditor.setValue(''); }catch(e){} }
  cSrc.value=''; cUse.value='';
}
function closeCompose(){
  resetCompose();
  if(state.back==='poster') showPoster(state.idx,false);
  else showIndex();
}
function saveCompose(){
  if(saving) return;
  var text=editorValue().trim();
  if(!text){ status('还没写内容'); try{ vditor&&vditor.focus(); }catch(e){} return; }
  var source=cSrc.value.trim(), use_case=cUse.value.trim();
  saving=true;
  if(editingId){
    var id=editingId, back=state.back;
    api('/quotes/'+encodeURIComponent(id),{method:'PATCH',
      body:{text:text,source:source,use_case:use_case,expected_updated_at:editingBase}})
      .then(function(r){
        if(r.__status===409){
          resetCompose();
          return reload({id:id}).then(function(){
            if(back==='poster' && indexOfId(id)>=0) showPoster(indexOfId(id),false);
            else showIndex();
            status('这条已在另一台设备改过，已刷新，请重新编辑',3600);
          });
        }
        if(!r.ok) throw new Error(r.error||('HTTP '+r.__status));
        resetCompose();
        return reload({id:id}).then(function(){
          if(back==='poster' && indexOfId(id)>=0) showPoster(indexOfId(id),false);
          else { showIndex(); repaint(iscroll.scrollTop,id); }
          status('已保存');
        });
      })
      .catch(function(e){ status('保存失败：'+String(e.message||e).slice(0,60)); })
      .then(function(){ saving=false; });
    return;
  }
  api('/quotes/add',{method:'POST',body:{text:text,source:source,use_case:use_case}})
    .then(function(r){
      if(!r.ok || !r.quote) throw new Error(r.error||('HTTP '+r.__status));
      var nid=r.quote.id, back=state.back;
      resetCompose();
      state.filter=null; state.q=''; qInput.value='';      /* 清空搜索与筛选 */
      return reload({id:nid}).then(function(){
        var k=indexOfId(nid);
        if(back==='poster' && k>=0){ showPoster(k,true); }
        else{
          state.scroll=0; showIndex(false);
          if(k>=0) setCur(k,true);                          /* 光标行落到新条目 */
        }
        status('已存入');
      });
    })
    .catch(function(e){ status('存入失败：'+String(e.message||e).slice(0,60)); })
    .then(function(){ saving=false; });
}
$('cCancel').addEventListener('click', closeCompose);
$('cSave').addEventListener('click', saveCompose);
/* 捕获阶段拿 Esc / Cmd+Enter，免得被 Vditor 自己的键盘处理吃掉 */
document.addEventListener('keydown', function(e){
  if(composeEl.hidden) return;
  if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); closeCompose(); return; }
  if((e.metaKey||e.ctrlKey) && e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); saveCompose(); }
}, true);

/* ---- 删除 ---- */
function delQuote(id){
  var q=byId(id); if(!q) return;
  if(!confirm('删了不可恢复（除非从备份/git 恢复），确认？')) return;
  api('/quotes/'+encodeURIComponent(id),{method:'DELETE'})
    .then(function(r){
      if(!r.ok) throw new Error(r.error||('HTTP '+r.__status));
      state.id=null; state.idx=0;
      return reload().then(function(){
        state.view='index';
        showIndex();
        status('已删');
      });
    })
    .catch(function(e){ status('删除失败：'+String(e.message||e).slice(0,60)); });
}

/* ---- 同步 ---- */
function syncNow(){
  var b=$('btnSync');
  if(b.disabled) return;
  b.disabled=true; b.textContent='同步中…';
  api('/sync-now',{method:'POST'})
    .then(function(r){
      status(r.status || (r.ok?'已同步':'同步失败'), 3600);
      if(r.ok){
        var keep = state.view==='index'? iscroll.scrollTop : null;
        var cid=(cur()||{}).id||state.id;
        return reload({id:cid}).then(function(){ repaint(keep,cid); });
      }
    })
    .catch(function(e){ status('同步出错：'+String(e.message||e).slice(0,60)); })
    .then(function(){ b.disabled=false; b.textContent='同步'; });
}

/* ---- 更新（checkUpdate 必须是全局函数：macOS 菜单栏 evaluate_js 调 checkUpdate(true)） ---- */
function cmpVer(a,b){
  var pa=String(a).split('.').map(Number), pb=String(b).split('.').map(Number), i, d;
  for(i=0;i<Math.max(pa.length,pb.length);i++){
    d=(pa[i]||0)-(pb[i]||0);
    if(d) return d>0?1:-1;
  }
  return 0;
}
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function checkUpdate(verbose){
  if(verbose) status('检查更新中……',8000);
  return api('/check-update').then(function(d){
    if(d.error){
      if(verbose) status('检查失败：'+String(d.error).slice(0,60)+(d.has_token?'':'（未配 .gh-token）'),4000);
      return;
    }
    var me=d.current, latest=d.latest;
    if(!latest){ if(verbose) status('远端 release 不存在',3000); return; }
    if(cmpVer(latest,me)>0){
      if(verbose) lsDel('dismissedVer');
      if(lsGet('dismissedVer')!==latest){
        $('ubarVer').textContent='v'+latest;
        ubar.setAttribute('data-url', d.html_url||'');
        ubar.setAttribute('data-ver', latest);
        ubar.classList.add('show');
      }
      if(verbose) status('发现新版本 v'+latest,3000);
    }else if(verbose) status('已是最新 v'+me,2600);
  }).catch(function(){ if(verbose) status('检查失败：server 无响应',3000); });
}
window.checkUpdate=checkUpdate;
var upTicks=0;
function pollUpdateProgress(){
  if(upTicks++>900){ status('更新状态未回报，已停止轮询',4000,false); return; }
  api('/update-progress').then(function(p){
    if(p.status==='error'){ status('更新失败：'+String(p.error||'').slice(0,80),6000,false); return; }
    if(p.status==='downloading'){
      var pct=p.total>0? Math.floor(p.downloaded/p.total*100) : 0;
      status('下载中 '+pct+'%',0,true); statusPct(pct);
    }else if(p.status==='downloaded'||p.status==='installing'){
      status('安装中……',0,true); statusPct(100);
    }else if(p.status==='restarting'){
      status('App 即将重启……',6000,false); statusPct(100); return;
    }
    setTimeout(pollUpdateProgress,400);
  }).catch(function(){ status('App 即将重启……',6000,false); });
}
$('ubarNow').addEventListener('click', function(){
  if(!confirm('立即下载新版本并替换 App 吗？\n替换过程 App 会自动重启。')) return;
  status('准备下载……',0,true); statusPct(0);
  api('/install-update',{method:'POST'}).then(function(d){
    if(d.error || !d.ok){ status('触发失败：'+String(d.error||'未知').slice(0,80),6000,false); return; }
    upTicks=0; pollUpdateProgress();
  }).catch(function(){ status('网络错误',4000,false); });
});
$('ubarView').addEventListener('click', function(){
  var u=ubar.getAttribute('data-url');
  if(u) window.open(u,'_blank');
});
$('ubarNo').addEventListener('click', function(){
  var v=ubar.getAttribute('data-ver');
  if(v) lsSet('dismissedVer',v);
  ubar.classList.remove('show');
});

/* ---- 自动刷新：每 7 秒比对 /health 的 total ---- */
var pollBusy=false;
function typingSomewhere(){
  var a=document.activeElement;
  if(!a) return false;
  if(a===qInput||a===cSrc||a===cUse) return true;
  return !!(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.isContentEditable);
}
function pollHealth(){
  if(pollBusy || state.load!=='ready') return;
  if(!composeEl.hidden) return;              /* 编辑面板开着不打断 */
  if(typingSomewhere()) return;
  pollBusy=true;
  api('/health').then(function(d){
    if(typeof d.total!=='number' || d.total===DB.length) return;
    var keep = state.view==='index'? iscroll.scrollTop : null;
    var cid = (cur()||{}).id || state.id;
    return reload({id:cid}).then(function(){ repaint(keep,cid); });
  }).catch(function(){}).then(function(){ pollBusy=false; });
}

/* ---- keyboard ---- */
function typing(e){
  var t=e.target;
  return !!(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable));
}
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){
    if(!helpEl.hidden){ closeHelp(); return; }
    if(!composeEl.hidden){ closeCompose(); return; }
    if(state.view==='poster'){ showIndex(); return; }
    if(state.q){ qInput.value=''; state.q=''; state.id=null; state.idx=0; state.cur=0; rebuild(); renderList(); return; }
    if(state.filter!==null){ setFilter(null); return; }
    return;
  }
  if(typing(e)) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(!composeEl.hidden) return;

  var k=e.key;
  if(k==='?'||(k==='/'&&e.shiftKey)){
    e.preventDefault();
    if(helpEl.hidden) openHelp(); else closeHelp();
    return;
  }
  if(!helpEl.hidden) return;
  if(k==='/'){
    e.preventDefault();
    if(state.view==='poster') showIndex();
    qInput.focus(); qInput.select();
    return;
  }
  if(k==='n'||k==='N'){ e.preventDefault(); openCompose(); return; }

  if(state.view==='index'){
    switch(k){
      case 'ArrowDown': case 'j': case 'J': e.preventDefault(); setCur(state.cur+1,true); break;
      case 'ArrowUp': case 'k': case 'K': e.preventDefault(); setCur(state.cur-1,true); break;
      case 'Home': e.preventDefault(); setCur(0,true); break;
      case 'End': e.preventDefault(); setCur(state.L.length-1,true); break;
      case 'Enter': e.preventDefault(); if(state.L.length) showPoster(state.cur,true); break;
      case 'p': case 'P': e.preventDefault(); togglePin(state.cur); break;
      case 'c': case 'C': e.preventDefault(); copyRow(state.cur); break;
      case 'e': case 'E': e.preventDefault(); var qi=at(state.cur); if(qi) openCompose(qi.id); break;
    }
    return;
  }
  switch(k){
    case 'ArrowRight': case 'ArrowDown': case 'j': case 'J': case ' ':
      e.preventDefault(); step(1); break;
    case 'ArrowLeft': case 'ArrowUp': case 'k': case 'K':
      e.preventDefault(); step(-1); break;
    case 'Home': e.preventDefault(); showPoster(0,true); break;
    case 'End': e.preventDefault(); showPoster(state.L.length-1,true); break;
    case 'p': case 'P': e.preventDefault(); togglePin(state.idx); break;
    case 'c': case 'C': e.preventDefault(); copyPoster(); break;
    case 'e': case 'E': e.preventDefault(); var qp=at(state.idx); if(qp) openCompose(qp.id); break;
    case 'i': case 'I': e.preventDefault(); showIndex(); break;
    case 'w': case 'W': e.preventDefault(); setWallpaper(); break;
  }
});

/* ---- wheel / swipe (poster) ---- */
/* 一次手势只翻一条：
   - 旧实现用 420ms 时间锁，触控板一次滑动的惯性尾巴能拖 1 秒多 → 会连翻（多）；
     且单个事件 delta<8 直接丢弃、不累计 → 轻滑不触发（漏）。
   - 现在按「手势」判定：事件间隔 >180ms、方向反转、或惯性衰减后重新加速 = 新手势；
     每个手势内累计位移，过阈值翻一条，之后本手势剩余的惯性事件全部吞掉。 */
var wAcc=0, wFired=false, wLast=0, wPeak=0, wMin=0, wScrolled=false;
stage.addEventListener('wheel', function(e){
  if(state.view!=='poster') return;
  var d=Math.abs(e.deltaY)>Math.abs(e.deltaX)? e.deltaY : e.deltaX;
  if(e.deltaMode===1) d*=32;                       /* 按「行」上报的鼠标滚轮 → 像素 */
  if(!d) return;
  var now=performance.now(), a=Math.abs(d);
  var reaccel = wMin<=wPeak*0.4 && a>=wMin*3 && a>=15;   /* 已明显衰减后又猛增 = 新的一划 */
  var fresh = (now-wLast>180) || (wAcc!==0 && (d>0)!==(wAcc>0)) || ((wFired||wScrolled) && reaccel);
  if(fresh){ wAcc=0; wFired=false; wScrolled=false; wPeak=0; wMin=0; }
  wLast=now;
  if(a>=wPeak){ wPeak=a; wMin=a; } else if(a<wMin){ wMin=a; }

  /* 长文海报本身可滚动：先让它原生滚；滚到头之后，要「另起一划」才翻页 */
  if(qtBox.classList.contains('ovf')){
    var atTop=qtBox.scrollTop<=0, atEnd=qtBox.scrollTop+qtBox.clientHeight>=qtBox.scrollHeight-1;
    if((d>0&&!atEnd)||(d<0&&!atTop)){ wScrolled=true; return; }
    if(wScrolled){ e.preventDefault(); return; }
  }
  e.preventDefault();
  if(wFired) return;
  wAcc+=d;
  if(Math.abs(wAcc)>=50){ wFired=true; step(wAcc>0?1:-1); }
},{passive:false});

var tx=0,ty=0,tActive=false;
stage.addEventListener('touchstart',function(e){
  if(e.touches.length!==1) return;
  tActive=true; tx=e.touches[0].clientX; ty=e.touches[0].clientY;
},{passive:true});
stage.addEventListener('touchend',function(e){
  if(!tActive) return; tActive=false;
  var t=e.changedTouches[0], dx=t.clientX-tx, dy=t.clientY-ty;
  if(Math.max(Math.abs(dx),Math.abs(dy))<46) return;
  if(Math.abs(dx)>Math.abs(dy)) step(dx<0?1:-1);
  else step(dy<0?1:-1);
},{passive:true});

/* ---- resize ---- */
var rt;
window.addEventListener('resize', function(){
  clearTimeout(rt);
  rt=setTimeout(function(){
    if(state.view==='poster') fitQuote();
    else { alignSearch(); fitLeads(); }
  },90);
});
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(function(){ if(state.view==='poster') fitQuote(); });
}

/* ---- boot ---- */
rebuild();
indexEl.hidden=false; app.hidden=true;
renderRail(); renderList();                    /* 先画「载入中」，不动 hash */
reload().then(function(){
  applyHash();
}).catch(function(e){
  state.load='error';
  renderRail(); renderList();
  status('载入失败：'+String(e.message||e).slice(0,60),5000);
});
setInterval(pollHealth,7000);
setTimeout(function(){ checkUpdate(false); },2000);
setInterval(function(){ checkUpdate(false); },60*60*1000);
})();
</script>
